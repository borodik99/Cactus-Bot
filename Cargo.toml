[package]
name = "cactus_bot"
version = "1.0.0"
edition = "2024"
description = "Telegram-бот для управления очередью полива офисного кактуса (Rust-версия)"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
deadpool-postgres = "0.14.2"
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", features = ["json", "native-tls"], default-features = false }
serde_json = "1.0.154"
teloxide = { version = "0.17.0", features = ["macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
